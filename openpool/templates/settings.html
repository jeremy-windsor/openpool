{% extends "base.html" %}
{% from "_form_errors.html" import error_summary, field_errors %}

{% block content %}
<section>
  <h1>Settings</h1>
  {{ error_summary(errors | default({})) }}
  <form method="post" action="/settings" class="form-card">
    <label>Pool name
      <input name="name" value="{{ pool.name }}">
      {{ field_errors(errors | default({}), "name") }}
    </label>
    <label>Volume
      <input name="volume_gallons" inputmode="decimal" value="{{ pool.volume_gallons | num(false) }}">
      <small>gallons</small>
      {{ field_errors(errors | default({}), "volume_gallons") }}
    </label>
    <label>Surface
      <input name="surface" value="{{ pool.surface }}">
      {{ field_errors(errors | default({}), "surface") }}
    </label>
    <label>Sanitizer
      <select name="sanitizer">
        <option value="liquid_chlorine" {% if pool.sanitizer == "liquid_chlorine" %}selected{% endif %}>Liquid chlorine</option>
        <option value="swg" {% if pool.sanitizer == "swg" %}selected{% endif %}>Salt water generator</option>
      </select>
      {{ field_errors(errors | default({}), "sanitizer") }}
    </label>
    <label>Timezone
      <input name="timezone" value="{{ pool.timezone }}">
      {{ field_errors(errors | default({}), "timezone") }}
    </label>
    <input name="unit_system" type="hidden" value="us">
    <label>Display units
      <select disabled aria-describedby="metric-status">
        <option selected>US units</option>
        <option>Metric</option>
      </select>
      <small id="metric-status">Metric display is not implemented yet — all inputs and results are US units.</small>
    </label>
    <label>Default chlorine strength
      <input name="default_chlorine_percent" inputmode="decimal" value="{{ pool.default_chlorine_percent | num(false) }}">
      <small>percent</small>
      {{ field_errors(errors | default({}), "default_chlorine_percent") }}
    </label>
    <label>Jug size
      <input name="jug_size_fl_oz" inputmode="decimal" value="{{ pool.jug_size_fl_oz | num(false) }}">
      <small>fl oz</small>
      {{ field_errors(errors | default({}), "jug_size_fl_oz") }}
    </label>
    <label>Salt bag size
      <input name="bag_size_lbs" inputmode="decimal" value="{{ pool.bag_size_lbs | num(false) }}">
      <small>lb</small>
      {{ field_errors(errors | default({}), "bag_size_lbs") }}
    </label>
    <input name="share_enabled" type="hidden" value="0">
    <label class="checkbox-row">
      <input name="share_enabled" type="checkbox" value="1" {% if pool.share_enabled %}checked{% endif %}>
      Enable read-only share endpoint
    </label>
    <label>Share token
      <input name="share_token" value="{{ pool.share_token or '' }}">
      {{ field_errors(errors | default({}), "share_token") }}
    </label>
    <button class="button primary" type="submit">Save settings</button>
  </form>
</section>
{% endblock %}
